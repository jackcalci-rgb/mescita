<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVOR · Accesso</title>
<link rel="icon" href="/static/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ec;--card:#fff;--ink:#1b1918;--muted:#7c736c;--accent:#cf4731;--line:#e8e1d8;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 26px;width:100%;max-width:360px;display:grid;gap:14px;box-shadow:0 4px 30px rgba(27,25,24,.08)}
img{width:180px;margin:0 auto 2px;display:block}
.sub{text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;color:var(--muted);margin:0 0 10px}
input{font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px;background:var(--accent);color:#fff;cursor:pointer}
#err{color:var(--bad);min-height:1.2em;margin:0;font-size:14px;text-align:center}
</style>
</head>
<body>
<form id="f">
  <img src="/static/logo-dvor.png" alt="DVOR">
  <p class="sub">Mescita a calice</p>
  <input id="nome" placeholder="Nome" autocomplete="username" required>
  <input id="pin" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password" required>
  <button>Entra</button>
  <p id="err"></p>
  <a href="/static/guida.html" style="text-align:center;color:var(--muted);font-size:14px">Guida per lo staff</a>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nome: nome.value, pin: pin.value})});
  if (r.ok) location.href = '/'; else document.getElementById('err').textContent = (await r.json()).detail || 'Errore';
};
</script>
</body>
</html>
